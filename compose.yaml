# Local equivalent of the Railway graph in .railway/railway.ts. Service start
# scripts, images and variables match the template, and services wait for each
# other in their start scripts as they must on Railway, so depends_on only
# orders container creation. Host ports bind to loopback only.
name: formbricks-surveys

x-formbricks-database-url: &database-url postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/formbricks?schema=public
x-hub-database-url: &hub-database-url postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/formbricks?sslmode=disable

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    entrypoint: ["/bin/sh", "-ec"]
    command: [". /template/scripts/postgres-start.sh"]
    environment:
      POSTGRES_DB: formbricks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPICEDB_DATABASE_PASSWORD: ${SPICEDB_DATABASE_PASSWORD:?Set SPICEDB_DATABASE_PASSWORD}
    volumes:
      - ./scripts:/template/scripts:ro
      # nocopy reproduces Railway's empty, root-owned volume.
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
        volume:
          nocopy: true
    mem_limit: 768m
    pids_limit: 256

  valkey:
    image: docker.io/valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    entrypoint: ["/bin/sh", "-ec"]
    command: [". /template/scripts/valkey-start.sh"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}
    volumes:
      - ./scripts:/template/scripts:ro
      - type: volume
        source: valkey-data
        target: /data
        volume:
          nocopy: true
    mem_limit: 256m
    pids_limit: 128

  spicedb:
    image: docker.io/authzed/spicedb:v1.57.0-debug@sha256:fdeb87ac0cbc31dc977b4d6c334ae3cae708069873706099c9d350089e85fd6d
    entrypoint: ["/bin/sh", "-ec"]
    command: [". /template/scripts/spicedb-start.sh"]
    environment:
      PORT: "8443"
      SPICEDB_HTTP_ENABLED: "true"
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgresql://spicedb:${SPICEDB_DATABASE_PASSWORD}@postgres:5432/spicedb?sslmode=disable
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:?Set SPICEDB_GRPC_PRESHARED_KEY}
      SPICEDB_DATASTORE_CONN_POOL_READ_MAX_OPEN: "8"
      SPICEDB_DATASTORE_CONN_POOL_READ_MIN_OPEN: "2"
      SPICEDB_DATASTORE_CONN_POOL_WRITE_MAX_OPEN: "4"
      SPICEDB_DATASTORE_CONN_POOL_WRITE_MIN_OPEN: "1"
      SPICEDB_SKIP_RELEASE_CHECK: "true"
      SPICEDB_LOG_FORMAT: json
      SPICEDB_LOG_LEVEL: warn
    volumes:
      - ./scripts:/template/scripts:ro
    mem_limit: 512m
    pids_limit: 256
    depends_on: [postgres]

  formbricks:
    image: ghcr.io/formbricks/formbricks:6.2.1@sha256:0da58d1bf3ea86d355d8e682851fdb74b4cb19ed7d7436a82ab069db7ba2b992
    entrypoint: ["/bin/sh", "-ec"]
    command: [". /template/scripts/formbricks-start.sh"]
    environment:
      PORT: "3000"
      HOSTNAME: "::"
      WEBAPP_URL: ${FORMBRICKS_URL:-http://localhost:13300}
      BETTER_AUTH_URL: ${FORMBRICKS_URL:-http://localhost:13300}
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      REDIS_URL: redis://default:${VALKEY_PASSWORD}@valkey:6379
      HUB_API_KEY: ${HUB_API_KEY:?Set HUB_API_KEY}
      HUB_API_URL: http://hub:8080
      CUBEJS_API_URL: http://cube:4000
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?Set CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      AUTHZED_ENABLED: "true"
      AUTHZED_ENDPOINT: spicedb:50051
      AUTHZED_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY}
      AUTHZED_SYSTEM_KEY: formbricks
      AUTHZED_INSECURE: "true"
      AUTHZED_CONSISTENCY: fully_consistent
      EMAIL_VERIFICATION_DISABLED: "1"
      PASSWORD_RESET_DISABLED: "1"
      TELEMETRY_DISABLED: "1"
      TRUSTED_PROXY_HOP_COUNT: "1"
      FORMBRICKS_OWNER_EMAIL: ${FORMBRICKS_OWNER_EMAIL:?Set FORMBRICKS_OWNER_EMAIL}
      FORMBRICKS_OWNER_PASSWORD: ${FORMBRICKS_OWNER_PASSWORD:?Set FORMBRICKS_OWNER_PASSWORD}
    volumes:
      - ./scripts:/template/scripts:ro
    ports:
      - "127.0.0.1:13300:3000"
    mem_limit: 1536m
    pids_limit: 512
    depends_on: [postgres, valkey, spicedb]

  hub:
    image: ghcr.io/formbricks/hub:0.14.3@sha256:63b85da9a0eb4346dd9350cd2bc82e9fe00b195756ad9a4bd50195ba874d10bc
    entrypoint: ["/bin/sh", "-ec"]
    command: [". /template/scripts/hub-start.sh"]
    environment:
      PORT: "8080"
      API_KEY: ${HUB_API_KEY:?Set HUB_API_KEY}
      DATABASE_URL: *hub-database-url
      FORMBRICKS_READY_URL: http://formbricks:3000/health/ready
    volumes:
      - ./scripts:/template/scripts:ro
    mem_limit: 256m
    pids_limit: 256
    depends_on: [postgres]

  hub-worker:
    image: ghcr.io/formbricks/hub:0.14.3@sha256:63b85da9a0eb4346dd9350cd2bc82e9fe00b195756ad9a4bd50195ba874d10bc
    entrypoint: ["/bin/sh", "-ec"]
    command: [". /template/scripts/hub-worker-start.sh"]
    environment:
      DATABASE_URL: *hub-database-url
      HUB_HEALTH_URL: http://hub:8080/health
    volumes:
      - ./scripts:/template/scripts:ro
    mem_limit: 256m
    pids_limit: 256
    depends_on: [postgres]

  cube:
    build: .
    image: localhost/formbricks-surveys-cube:local
    environment:
      PORT: "4000"
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: formbricks
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?Set CUBEJS_API_SECRET}
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_EXTERNAL_DEFAULT: "false"
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_DB_QUERY_TIMEOUT: 60s
      CUBEJS_TELEMETRY: "false"
    mem_limit: 768m
    pids_limit: 256
    depends_on: [postgres]

volumes:
  postgres-data:
  valkey-data:
